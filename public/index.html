<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SITANI TECH MD • Pair Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b1136 0%, #0b0716 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 16, 44, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #0f0a1f;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #a855f7;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #7c3aed, #9333ea);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #0f0a1f;
      border: 1px dashed #38bdf8;
      text-align: center;
      display: none;
    }

    .code-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #38bdf8;
      margin: 8px 0 12px;
      user-select: all;
    }

    .copy-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      width: auto;
    }

    .error-msg {
      margin-top: 14px;
      color: #f87171;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
    }

    .links a {
      color: #a855f7;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">👻 SITANI TECH MD • V2.5.0</div>
    <h1>Pair Code Generator</h1>
    <p class="subtitle">
      Enter your WhatsApp number in international format with country code and digits only (no <code>+</code> or spaces).
    </p>

    <label for="number">WhatsApp Number</label>
    <input
      type="tel"
      id="number"
      placeholder="2567XXXXXXXX"
      inputmode="numeric"
      autocomplete="off"
    />

    <button id="submitBtn" onclick="getPairCode()">Generate Pairing Code</button>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultBox" class="result-box">
      <div style="font-size: 12px; color: #94a3b8;">YOUR PAIRING CODE</div>
      <div id="pairCode" class="code-text">---- ----</div>
      <button class="copy-btn" onclick="copyCode()">Copy Code</button>
    </div>

    <div class="links">
      <a href="/">Home</a>
      <a href="/qr">QR Scan</a>
    </div>
  </div>

  <script>
    async function getPairCode() {
      const raw = document.getElementById('number').value.trim();
      const number = raw.replace(/[^0-9]/g, '');
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultBox = document.getElementById('resultBox');
      const pairCodeEl = document.getElementById('pairCode');

      errorMsg.style.display = 'none';
      resultBox.style.display = 'none';

      if (!number || number.length < 10) {
        errorMsg.textContent = 'Please enter a valid WhatsApp number with country code (e.g. 2567XXXXXXXX).';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating code...';

      try {
        // NOTE: Match this endpoint to your backend route (commonly /code?number= or /pair)
        const res = await fetch(`/code?number=${encodeURIComponent(number)}`);
        const data = await res.json();

        if (data.code) {
          pairCodeEl.textContent = data.code;
          resultBox.style.display = 'block';
        } else {
          errorMsg.textContent = data.error || data.message || 'Failed to generate pairing code.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Server error. Please try again in a moment.';
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Pairing Code';
      }
    }

    function copyCode() {
      const code = document.getElementById('pairCode').textContent;
      navigator.clipboard.writeText(code);
      alert('Pairing code copied: ' + code);
    }
  </script>
</body>
</html>
