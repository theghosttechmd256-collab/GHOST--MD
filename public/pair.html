
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITANI THE HACKER • Pair</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#261044,#090611);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;border:1px solid #7843b8;border-radius:25px;padding:28px;background:#150d23;box-shadow:0 0 35px #0008}
.logo{width:86px;height:86px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,#7c3aed,#c084fc);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold}
.brand{text-align:center;color:#c084fc;font-weight:bold;letter-spacing:3px;font-size:14px}
h1{text-align:center;font-size:28px;margin:20px 0;background:linear-gradient(90deg,#a855f7,#38bdf8);color:transparent;background-clip:text}
p{color:#c9b9dc;line-height:1.7}
label{display:block;margin:22px 0 9px;font-weight:bold}
input{width:100%;padding:17px;border:1px solid #624080;border-radius:14px;background:#0c0815;color:white;font-size:17px}
button{width:100%;margin-top:18px;padding:17px;border:0;border-radius:14px;background:linear-gradient(90deg,#7135d5,#9b35df);color:white;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#message{margin-top:18px;text-align:center;word-break:break-word}
#result{display:none;margin-top:18px;padding:20px;border:1px dashed #a855f7;border-radius:14px;text-align:center}
#code{font-size:27px;font-weight:bold;letter-spacing:3px;color:#c084fc;margin:15px 0}
.links{display:flex;justify-content:space-around;margin-top:25px;padding-top:20px;border-top:1px solid #382447}
a{color:#c084fc}
.footer{text-align:center;margin-top:25px;color:#8f7ca8;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="logo">S</div>
<div class="brand">SITANI THE HACKER</div>
<h1>Pair Code Generator</h1>
<p>Enter the authorized WhatsApp number in international format. Use digits only, including your country code.</p>

<label for="phone">WhatsApp number</label>
<input id="phone" type="tel" inputmode="numeric" placeholder="2567XXXXXXXX">

<button id="generate" onclick="generateCode()">Generate Pairing Code</button>

<div id="message"></div>
<div id="result">
<div>Your pairing code</div>
<div id="code"></div>
<button onclick="copyCode()">Copy code</button>
</div>

<div class="links">
<a href="/">Home</a>
<a href="/qr.html">QR Scan</a>
</div>
<div class="footer">GHOST-MD WhatsApp Automation</div>
</div>

<script>
async function generateCode(){
 const phone=document.getElementById('phone').value.replace(/\D/g,'');
 const btn=document.getElementById('generate');
 const message=document.getElementById('message');
 const result=document.getElementById('result');
 result.style.display='none';
 message.style.color='#fca5a5';

 if(phone.length<8||phone.length>15){
   message.textContent='Enter a valid number with country code.';
   return;
 }
 btn.disabled=true;
 btn.textContent='Requesting code...';
 message.textContent='Please wait...';
 try{
   const response=await fetch('/api/pair',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({phone})
   });
   const data=await response.json();
   if(!response.ok) throw new Error(data.error||'Pairing request failed.');
   document.getElementById('code').textContent=data.code||'';
   result.style.display='block';
   message.style.color='#86efac';
   message.textContent=data.message||'Code generated. Use it in WhatsApp Linked Devices.';
 }catch(error){
   message.textContent=error.message||'Server error. Please try again.';
 }finally{
   btn.disabled=false;
   btn.textContent='Generate Pairing Code';
 }
}
async function copyCode(){
 const code=document.getElementById('code').textContent;
 try{await navigator.clipboard.writeText(code);alert('Code copied!');}
 catch(e){alert('Copy the code manually: '+code);}
}
</script>
</body>
</html>
