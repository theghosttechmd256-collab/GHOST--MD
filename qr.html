<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHOST-MD QR</title><link rel="stylesheet" href="/style.css"></head><body><main><img class="logo" src="/assets/ghost-md-poster.png" alt="GHOST-MD ghost artwork"><div class="brand">𓆩 GHOST-MD 𓆪 · V2.5.0</div><div class="symbol">〕━━╮\n┃ 👻 QR SCAN\n┃ ⚡ SECURE PAIRING\n╰━━━━━━━━━━━━━━━━╯</div><h1>QR Scan Website</h1><p>Pair only a WhatsApp account you own or are authorized to manage.</p><label>Panel password</label><input id="password" type="password"><button id="start">Start WhatsApp connection</button><button id="load">Show QR code</button><img id="qr" alt="WhatsApp QR" hidden><div id="result" role="status"></div><nav><a href="/index.html">Home</a><a href="/pair.html">Pair Code</a></nav><script>const $=id=>document.getElementById(id),h=()=>({'content-type':'application/json','x-panel-password':$('password').value});async function call(url,method='GET'){ $('result').textContent='Please wait…';try{const r=await fetch(url,{method,headers:h()});const d=await r.json();$('result').textContent=d.message||d.error||'';return d}catch(e){$('result').textContent='Network error';}}$('start').onclick=()=>call('/api/start','POST');$('load').onclick=async()=>{const d=await call('/api/qr');if(d?.qr){$('qr').src=d.qr;$('qr').hidden=false}};</script></main></body></html>
