<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHOST-MD Pair Code</title><link rel="stylesheet" href="/style.css"></head><body><main><img class="logo" src="/assets/ghost-md-poster.png" alt="GHOST-MD ghost artwork"><div class="brand">𓆩 GHOST-MD 𓆪 · V2.5.0</div><div class="symbol">〕━━╮\n┃ 👻 PAIR CODE\n┃ ⚡ SECURE PAIRING\n╰━━━━━━━━━━━━━━━━╯</div><h1>Pair Code Website</h1><p>Enter your own WhatsApp number in international format, with country code and digits only.</p><label>Panel password</label><input id="password" type="password"><label>WhatsApp number</label><input id="phone" inputmode="numeric" placeholder="2567XXXXXXXX"><button id="load">Generate pairing code</button><div id="result" role="status"></div><nav><a href="/index.html">Home</a><a href="/qr.html">QR Scan</a></nav><script>const $=id=>document.getElementById(id);$('load').onclick=async()=>{const phone=$('phone').value.replace(/\\D/g,'');$('load').disabled=true;$('result').textContent='Requesting code…';try{const r=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json','x-panel-password':$('password').value},body:JSON.stringify({phone})});const d=await r.json();$('result').textContent=d.code?'PAIRING CODE: '+d.code:(d.error||'Could not generate code.')}catch(e){$('result').textContent='Network error'}finally{$('load').disabled=false}};</script></main></body></html>
